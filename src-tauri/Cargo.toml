[package]
name = "quota-float"
version = "0.3.35"
description = "Local-first desktop quota monitor for coding assistants on Windows and macOS"
authors = ["Quota Float contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "quota_float_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.42", features = ["bundled"] }
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["macros", "process", "sync", "time"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-wdio = { version = "1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"
