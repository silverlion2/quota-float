name: Release

run-name: Release ${{ inputs.version || github.ref_name }} (publish=${{ github.event_name != 'workflow_dispatch' || inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, beta, stable, or an explicit x.y.z[-beta.n]
        required: true
        default: patch
        type: string
      publish:
        description: Create the release commit/tag and publish after verification
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: quota-float-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_context.outputs.version }}
      tag: ${{ steps.release_context.outputs.tag }}
      source_sha: ${{ steps.release_context.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify or plan the release
        id: release_context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VERSION_SPEC: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REF_NAME" != "main" ]]; then
              echo "Manual releases must be dispatched from main, not $REF_NAME." >&2
              exit 1
            fi
            git switch -C main "$GITHUB_SHA"
            target="$(npm run --silent release -- "$VERSION_SPEC" --print-target)"
            npm run release -- "$VERSION_SPEC" --dry-run --yes
            tag="v${target}"
          else
            npm run version:check -- --tag "$REF_NAME"
            previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
            echo "Changes included in $REF_NAME:"
            if [[ -n "$previous_tag" ]]; then
              git log "${previous_tag}..${GITHUB_SHA}" --pretty='  - %s'
            else
              git log "${GITHUB_SHA}" --pretty='  - %s'
            fi
            npm test
            npm run build
            cargo test --manifest-path src-tauri/Cargo.toml
            target="${REF_NAME#v}"
            tag="$REF_NAME"
          fi
          echo "version=$target" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Verified release candidate $tag at $GITHUB_SHA."

  create-release-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release
    outputs:
      release_sha: ${{ steps.release_ref.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Create and push the release commit and tag
        id: release_ref
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION_SPEC: ${{ inputs.version }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          current_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" != "$EXPECTED_SHA" || "$remote_sha" != "$EXPECTED_SHA" ]]; then
            echo "main changed after verification; rerun the release workflow." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release -- "$VERSION_SPEC" --verified-by-ci --no-push --yes
          release_sha="$(git rev-parse HEAD)"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Pushed $RELEASE_TAG at $release_sha."

  create-draft:
    if: >-
      ${{
        always() &&
        needs.verify.result == 'success' &&
        (
          github.event_name == 'push' ||
          (inputs.publish && needs.create-release-ref.result == 'success')
        )
      }}
    needs: [verify, create-release-ref]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      release_body: ${{ steps.release_notes.outputs.result }}
    steps:
      - name: Generate release notes
        id: release_notes
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || needs.create-release-ref.outputs.release_sha }}
          WINDOWS_PLATFORM_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          MACOS_PLATFORM_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
          MACOS_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: process.env.RELEASE_SHA,
            });
            const signing = [
              `Windows Authenticode: ${process.env.WINDOWS_PLATFORM_SIGNING === "true" ? "verified by release CI" : "not configured"}`,
              `macOS Developer ID: ${process.env.MACOS_PLATFORM_SIGNING === "true" ? "verified by release CI" : "not configured"}`,
              `macOS notarization: ${process.env.MACOS_NOTARIZATION === "true" ? "validated by release CI" : "not configured"}`,
            ];
            return `${data.body}\n\n## Platform signing\n\n${signing.map((item) => `- ${item}`).join("\n")}\n\nTauri updater signatures are generated independently for both platforms.\n\n## Privacy\n\nQuota Float remains local-first: it reads existing local sign-in state only for quota requests and does not upload prompts, chats, raw quota responses, or local credentials.`;
      - name: Prepare one shared release draft before parallel builds
        id: draft
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || needs.create-release-ref.outputs.release_sha }}
          RELEASE_BODY: ${{ steps.release_notes.outputs.result }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const matches = releases.filter((release) => release.tag_name === tag);
            if (matches.length > 1) {
              core.setFailed(`Refusing to build ${tag}; multiple releases share this tag.`);
              return;
            }
            let release = matches[0];
            if (release && (!release.draft || release.target_commitish !== sha)) {
              core.setFailed(`Refusing to reuse ${tag}; the existing release must be a draft for the exact verified commit.`);
              return;
            }
            if (!release) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: sha,
                name: `Quota Float ${tag}`,
                body: process.env.RELEASE_BODY,
                draft: true,
                prerelease: tag.includes("-"),
              });
              release = data;
            }
            core.setOutput("release_id", String(release.id));
            core.info(`Both platform builders will upload to draft ${release.id} for ${tag}.`);

  publish-windows:
    if: ${{ always() && needs.create-draft.result == 'success' }}
    needs: [verify, create-release-ref, create-draft]
    permissions:
      contents: write
    runs-on: windows-latest
    outputs:
      release_id: ${{ needs.create-draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || needs.create-release-ref.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Retain the pre-split cache namespace; OS/toolchain isolation is automatic.
          shared-key: publish-draft
      - run: npm ci
      - name: Configure optional platform code signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            '{}' | Set-Content -LiteralPath 'src-tauri/tauri.release.conf.json' -Encoding utf8NoBOM
            Write-Host '::notice::WINDOWS_CERTIFICATE is not configured; the release will retain Tauri updater signing but will not have Authenticode.'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is configured.'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'quota-float-release.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password
          Remove-Item -LiteralPath $certificatePath -Force
          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
            throw 'The Windows signing certificate could not be imported.'
          }
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            'http://timestamp.digicert.com'
          } else {
            $env:WINDOWS_TIMESTAMP_URL
          }
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = $timestampUrl
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'src-tauri/tauri.release.conf.json' -Encoding utf8NoBOM
          Write-Host 'Configured Authenticode with the imported project certificate.'
      - name: Verify the checked-out release ref
        shell: bash
        run: npm run version:check -- --tag "${{ needs.verify.outputs.tag }}"
      - name: Build and upload draft release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-draft.outputs.release_id }}
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: Quota Float ${{ needs.verify.outputs.tag }}
          releaseBody: ${{ needs.create-draft.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ contains(needs.verify.outputs.tag, '-') }}
          includeUpdaterJson: false
          args: "--bundles nsis --config src-tauri/tauri.release.conf.json"
      - name: Scan the exact Windows release artifacts with Microsoft Defender
        shell: powershell
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*x64-setup.exe" |
            Select-Object -ExpandProperty FullName -First 1
          ./scripts/verify-windows-defender.ps1 -EnableRealTimeProtection -Path @(
            "src-tauri/target/release/quota-float.exe",
            $installer
          )
      - name: Verify Authenticode when configured
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            exit 0
          }
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*x64-setup.exe' |
            Select-Object -ExpandProperty FullName -First 1
          foreach ($artifact in @('src-tauri/target/release/quota-float.exe', $installer)) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for ${artifact}: $($signature.StatusMessage)"
            }
          }

  publish-macos:
    if: ${{ always() && needs.create-draft.result == 'success' }}
    needs: [verify, create-release-ref, create-draft]
    permissions:
      contents: write
    runs-on: macos-latest
    outputs:
      release_id: ${{ needs.create-draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || needs.create-release-ref.outputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Retain the pre-split cache namespace; OS/toolchain isolation is automatic.
          shared-key: publish-draft
      - run: npm ci
      - name: Configure optional macOS signing and notarization
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          printf '{}\n' > src-tauri/tauri.release.conf.json
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo '::notice::APPLE_CERTIFICATE is not configured; the release will retain Tauri updater signing but will not have Developer ID signing or notarization.'
            exit 0
          fi
          if [[ -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo 'APPLE_CERTIFICATE_PASSWORD and KEYCHAIN_PASSWORD are required when APPLE_CERTIFICATE is configured.' >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/quota-float-release.p12"
          keychain_path="$RUNNER_TEMP/quota-float-release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          rm -f "$certificate_path"
          if [[ -z "$signing_identity" ]]; then
            echo 'No Developer ID Application identity was found in APPLE_CERTIFICATE.' >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo 'Configured Developer ID signing with the imported project certificate.'
      - name: Verify the checked-out release ref
        shell: bash
        run: npm run version:check -- --tag "${{ needs.verify.outputs.tag }}"
      - name: Build and upload draft release artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-draft.outputs.release_id }}
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: Quota Float ${{ needs.verify.outputs.tag }}
          releaseBody: ${{ needs.create-draft.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ contains(needs.verify.outputs.tag, '-') }}
          includeUpdaterJson: false
          args: "--target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json"
      - name: Verify Developer ID signature and notarization when configured
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            exit 0
          fi
          app_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          if [[ -n "$APPLE_ID" ]]; then
            xcrun stapler validate "$app_path"
          fi

  assemble-updater:
    if: ${{ always() && needs.publish-windows.result == 'success' && needs.publish-macos.result == 'success' }}
    needs: [verify, create-release-ref, create-draft, publish-windows, publish-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || needs.create-release-ref.outputs.release_sha }}
      - name: Write the updater manifest once from both verified platform builds
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || needs.create-release-ref.outputs.release_sha }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { assembleUpdater } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/assemble-updater.mjs`).href);
            const result = await assembleUpdater({
              github, owner: context.repo.owner, repo: context.repo.repo,
              releaseId: Number(process.env.RELEASE_ID), tag: process.env.RELEASE_TAG,
              releaseSha: process.env.RELEASE_SHA, serverUrl: process.env.GITHUB_SERVER_URL,
            });
            core.info(`Created updater manifest asset ${result.assetId} for ${result.manifest.version}.`);

  upgrade-smoke:
    if: ${{ always() && needs.publish-windows.result == 'success' && !contains(needs.verify.outputs.tag, '-') }}
    needs: [verify, publish-windows]
    runs-on: windows-latest
    # GitHub only exposes draft releases to tokens with push access. The script performs GET/download calls only.
    permissions:
      contents: write
    outputs:
      candidate_release_id: ${{ steps.upgrade.outputs.candidate_release_id }}
      candidate_asset_id: ${{ steps.upgrade.outputs.candidate_asset_id }}
      candidate_asset_name: ${{ steps.upgrade.outputs.candidate_asset_name }}
      candidate_sha256: ${{ steps.upgrade.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Verify previous-to-candidate per-user upgrade while the release is draft
        id: upgrade
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/verify-windows-upgrade.ps1 -Repository "${{ github.repository }}" -CurrentTag "${{ needs.verify.outputs.tag }}" -CandidateReleaseId "${{ needs.publish-windows.outputs.release_id }}"

  finalize:
    needs: [verify, create-release-ref, create-draft, publish-windows, publish-macos, assemble-updater, upgrade-smoke]
    if: >-
      ${{
        always() &&
        needs.publish-windows.result == 'success' &&
        needs.publish-macos.result == 'success' &&
        needs.assemble-updater.result == 'success' &&
        (
          contains(needs.verify.outputs.tag, '-') ||
          needs.upgrade-smoke.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
      release_id: ${{ steps.publish.outputs.release_id }}
    steps:
      - name: Verify the gated artifact set and publish the draft
        id: publish
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PREPARED_RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
          CANDIDATE_RELEASE_ID: ${{ needs.upgrade-smoke.outputs.candidate_release_id }}
          RELEASE_SHA: ${{ github.event_name == 'push' && github.sha || needs.create-release-ref.outputs.release_sha }}
          CANDIDATE_ASSET_ID: ${{ needs.upgrade-smoke.outputs.candidate_asset_id }}
          CANDIDATE_ASSET_NAME: ${{ needs.upgrade-smoke.outputs.candidate_asset_name }}
          CANDIDATE_SHA256: ${{ needs.upgrade-smoke.outputs.candidate_sha256 }}
        with:
          script: |
            const crypto = require("crypto");
            const tag = process.env.RELEASE_TAG;
            const stable = !tag.includes("-");
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const matches = releases.filter((candidate) => candidate.tag_name === tag);
            if (matches.length !== 1 || String(matches[0].id) !== process.env.PREPARED_RELEASE_ID) {
              core.setFailed(`Refusing to publish ${tag}; expected only the pre-created release draft.`);
              return;
            }
            const release = matches[0];
            if (!release.draft) {
              core.setFailed(`${tag} is already public; refusing to overwrite it.`);
              return;
            }
            const names = release.assets.map((asset) => asset.name);
            const required = [
              ["updater manifest", (name) => name === "latest.json"],
              ["Windows installer", (name) => /_x64-setup\.exe$/.test(name)],
              ["Windows updater signature", (name) => /_x64-setup\.exe\.sig$/.test(name)],
              ["macOS Universal DMG", (name) => /_universal\.dmg$/.test(name)],
              ["macOS updater archive", (name) => /_universal\.app\.tar\.gz$/.test(name)],
              ["macOS updater signature", (name) => /_universal\.app\.tar\.gz\.sig$/.test(name)],
            ];
            const missing = required.filter(([, matches]) => !names.some(matches)).map(([label]) => label);
            if (missing.length > 0) {
              core.setFailed(`Refusing to publish ${tag}; missing: ${missing.join(", ")}. Uploaded: ${names.join(", ")}`);
              return;
            }
            const windowsInstallers = release.assets.filter((asset) => /_x64-setup\.exe$/.test(asset.name));
            if (windowsInstallers.length !== 1) {
              core.setFailed(`Refusing to publish ${tag}; expected exactly one Windows installer, found ${windowsInstallers.length}.`);
              return;
            }
            const downloadText = async (asset) => {
              const { data } = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: { accept: "application/octet-stream" },
              });
              return Buffer.from(data).toString("utf8").trim();
            };
            const manifest = JSON.parse(await downloadText(release.assets.find((asset) => asset.name === "latest.json")));
            const platforms = manifest.platforms;
            const requiredPlatforms = ["windows-x86_64", "darwin-aarch64", "darwin-x86_64"];
            if (manifest.version !== tag.slice(1) || !platforms ||
                !requiredPlatforms.every((platform) => platforms[platform])) {
              core.setFailed(`Refusing to publish ${tag}; updater version or required platform entries are incomplete.`);
              return;
            }
            const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
            const signatures = new Map();
            for (const [platform, entry] of Object.entries(platforms)) {
              const assetName = platform.startsWith("windows-") ? windowsInstallers[0].name
                : platform.startsWith("darwin-") ? names.find((name) => /_universal\.app\.tar\.gz$/.test(name)) : null;
              const signatureAsset = release.assets.find((asset) => asset.name === `${assetName}.sig`);
              const expectedUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/download/${encodeURIComponent(tag)}/${encodeURIComponent(assetName)}`;
              if (!assetName || !signatureAsset || !entry || entry.url !== expectedUrl) {
                core.setFailed(`Refusing to publish ${tag}; updater ${platform} does not point to its exact draft artifact.`);
                return;
              }
              if (!signatures.has(signatureAsset.id)) {
                signatures.set(signatureAsset.id, await downloadText(signatureAsset));
              }
              const signature = signatures.get(signatureAsset.id);
              if (!signature || typeof entry.signature !== "string" || entry.signature.trim() !== signature) {
                core.setFailed(`Refusing to publish ${tag}; updater ${platform} signature does not match its draft artifact.`);
                return;
              }
            }
            if (stable) {
              const expected = {
                releaseId: process.env.CANDIDATE_RELEASE_ID,
                assetId: process.env.CANDIDATE_ASSET_ID,
                assetName: process.env.CANDIDATE_ASSET_NAME,
                sha256: process.env.CANDIDATE_SHA256?.toLowerCase(),
              };
              if (!expected.releaseId || !expected.assetId || !expected.assetName || !/^[0-9a-f]{64}$/.test(expected.sha256 ?? "")) {
                core.setFailed(`Refusing to publish stable ${tag}; the draft upgrade smoke did not emit complete artifact evidence.`);
                return;
              }
              const installer = windowsInstallers[0];
              if (
                String(release.id) !== expected.releaseId ||
                String(installer.id) !== expected.assetId ||
                installer.name !== expected.assetName
              ) {
                core.setFailed(`Refusing to publish ${tag}; the draft or Windows installer changed after upgrade smoke.`);
                return;
              }
              const downloaded = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: installer.id,
                headers: { accept: "application/octet-stream" },
              });
              const observedSha256 = crypto.createHash("sha256").update(Buffer.from(downloaded.data)).digest("hex");
              if (observedSha256 !== expected.sha256) {
                core.setFailed(`Refusing to publish ${tag}; the tested Windows installer digest changed.`);
                return;
              }
              const { data: candidateNow } = await github.rest.repos.getRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              if (!candidateNow.draft || !candidateNow.assets.some((asset) => asset.id === installer.id)) {
                core.setFailed(`Refusing to publish ${tag}; the tested draft asset is no longer present.`);
                return;
              }
              core.info(`Upgrade gate verified draft asset ${installer.id} at sha256:${observedSha256}.`);
            }
            const { data: published } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              draft: false,
              target_commitish: process.env.RELEASE_SHA,
              prerelease: tag.includes("-"),
            });
            core.setOutput("release_url", published.html_url);
            core.setOutput("release_id", String(published.id));
            core.info(`Published ${tag} with ${names.length} verified assets: ${published.html_url}`);

  post-release-distribution:
    needs: [verify, finalize, upgrade-smoke]
    if: ${{ always() && needs.finalize.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the published asset inventory and tested installer distribution
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_ID: ${{ needs.finalize.outputs.release_id }}
          CANDIDATE_ASSET_ID: ${{ needs.upgrade-smoke.outputs.candidate_asset_id }}
          CANDIDATE_SHA256: ${{ needs.upgrade-smoke.outputs.candidate_sha256 }}
        with:
          script: |
            const crypto = require("crypto");
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            if (release.draft || release.tag_name !== tag) {
              core.setFailed(`Post-release distribution check could not resolve public ${tag}.`);
              return;
            }
            const names = release.assets.map((asset) => asset.name);
            const required = [
              ["updater manifest", (name) => name === "latest.json"],
              ["Windows installer", (name) => /_x64-setup\.exe$/.test(name)],
              ["Windows updater signature", (name) => /_x64-setup\.exe\.sig$/.test(name)],
              ["macOS Universal DMG", (name) => /_universal\.dmg$/.test(name)],
              ["macOS updater archive", (name) => /_universal\.app\.tar\.gz$/.test(name)],
              ["macOS updater signature", (name) => /_universal\.app\.tar\.gz\.sig$/.test(name)],
            ];
            const missing = required.filter(([, matches]) => !names.some(matches)).map(([label]) => label);
            if (missing.length > 0) {
              core.setFailed(`Public ${tag} is missing distributed assets: ${missing.join(", ")}.`);
              return;
            }
            if (!tag.includes("-")) {
              const installer = release.assets.find((asset) => String(asset.id) === process.env.CANDIDATE_ASSET_ID);
              if (!installer) {
                core.setFailed(`Public ${tag} no longer exposes the installer that passed upgrade smoke.`);
                return;
              }
              const downloaded = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: installer.id,
                headers: { accept: "application/octet-stream" },
              });
              const digest = crypto.createHash("sha256").update(Buffer.from(downloaded.data)).digest("hex");
              if (digest !== process.env.CANDIDATE_SHA256) {
                core.setFailed(`Public ${tag} installer does not match the upgrade-tested draft asset.`);
                return;
              }
            }
            core.info(`Public distribution check passed for ${tag} with ${names.length} assets.`);
