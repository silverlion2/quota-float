name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm audit --audit-level=high

  desktop:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: quota-float-windows-unsigned
            build-command: >-
              npm run tauri -- build --config src-tauri/tauri.ci.conf.json
            artifact-path: src-tauri/target/release/bundle/**
          - os: macos-latest
            artifact-name: quota-float-macos-universal-unsigned
            build-command: >-
              npm run tauri -- build --target universal-apple-darwin --config src-tauri/tauri.ci.conf.json
            artifact-path: src-tauri/target/universal-apple-darwin/release/bundle/**
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: ${{ matrix.build-command }}
      - name: Verify Windows artifacts with Microsoft Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*x64-setup.exe" |
            Select-Object -ExpandProperty FullName -First 1
          ./scripts/verify-windows-defender.ps1 -EnableRealTimeProtection -Path @(
            "src-tauri/target/release/quota-float.exe",
            $installer
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
